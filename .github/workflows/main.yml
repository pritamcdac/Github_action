name: Event-Based Workflow

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

  pull_request:
    branches:
      - master

  issue_comment:
    types: [created]

  release:
    types: [created]

  workflow_dispatch:
    inputs:
      name:
        description: 'Name to greet'
        required: false
        default: 'Pritam'

jobs:
  run_echo_commands:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Triggered by a push to the master branch
      - name: Echo on push to master
        if: github.event_name == 'push' && github.base_ref == 'master'
        run: |
          echo "This is a push event to the master branch!"

      # Triggered by a tag push
      - name: Echo on tag push
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "A new tag was pushed: ${{ github.ref }}"

      # Triggered by a pull request to master
      - name: Echo on pull request to master
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        run: |
          echo "This is a pull request event to the master branch!"

      # Triggered when an issue comment is created
      - name: Echo on issue comment
        if: github.event_name == 'issue_comment' && github.event.action == 'created'
        run: |
          echo "An issue comment was created: ${{ github.event.comment.body }}"

      # Triggered when a release is created
      - name: Echo on release creation
        if: github.event_name == 'release' && github.event.action == 'created'
        run: |
          echo "A new release was created with the tag: ${{ github.event.release.tag_name }}"

      # Triggered manually with workflow_dispatch
      - name: Echo on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Hello, ${{ github.event.inputs.name }}! This is a manual trigger of the workflow."



